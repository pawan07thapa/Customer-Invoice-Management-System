spring:
  profile:
    active: e0
  mvc:
    view:
      prefix: /WEB-INF/
      suffix: .jsp
  datasource:
    url: jdbc:postgresql://postgres:5432/cmis
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: cmis
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      max-lifetime: 30000
      auto-commit: true
  sql:
    init:
      mode: always
  schema-locations: classpath:schema-postgresql.sql
  data-locations: classpath:insert-customers.sql
